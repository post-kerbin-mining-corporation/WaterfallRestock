// Mk-55 "Thud" Liquid Fuel Engine
@PART[radialLiquidEngine1-2]:NEEDS[ReStock]:FOR[WaterfallRestock]
{
	!MODULE[ModuleWaterfallFX] {}
 	!EFFECTS {}
	!MODULE[EngineLightEffect] {}

	EFFECTS
  {
    engage
    {
      AUDIO
      {
        channel = Ship
        clip = sound_vent_medium
        volume = 1.0
        pitch = 2.0
        loop = false
      }
    }
    flameout
    {
      AUDIO
      {
        channel = Ship
        clip = sound_explosion_low
        volume = 1.0
        pitch = 2.0
        loop = false
      }
    }
    fx-thud-running
    {
      AUDIO
      {
        channel = Ship
        clip = sound_rocket_hard
        volume = 0.0 0.0
        volume = 1.0 1.0
        pitch = 0.0 0.2
        pitch = 1.0 1.0
        loop = true
      }
    }
  }

	MODULE
	{
		name = ModuleWaterfallFX
		// This is a custom name
		moduleID = radialLiquidEngine1-2FX
		// This links the effects to a given ModuleEngines
		engineID = radialLiquidEngine1-2

		// List out all controllers we want available
    // This controller scales with atmosphere depth
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    // This controller scales with effective throttle
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
    }
    // this controller generates a random value in the range specified
    CONTROLLER
    {
      name = random
      linkedTo = random
      range = -1, 1
		}

    // -----------------------------------------------------
    // Past here should be generated with the ingame editor!
    // -----------------------------------------------------
    TEMPLATE
    {
      // This is the name of the template to use
      templateName = waterfall-kerolox-lower-5
      // This field allows you to override the parentTransform name in the EFFECTS contained in the template
      overrideParentTransform = thrustTransform
      position = 0, 0, 0.075
      rotation = 0, 0, 0
      scale = 0.76, 0.76, 0.6
    }

    TEMPLATE
    {
      // This is the name of the template to use
      templateName = waterfall-kerolox-exhaust-1
      // This field allows you to override the parentTransform name in the EFFECTS contained in the template
      overrideParentTransform = exhaust_fxTransform
      position = 0, 0, 0.002
      rotation = -90, 0, 0
      scale = 0.3, 0.3, 0.3
    }
	}
}