// LV-T91 "Cheetah" Liquid Fuel Engine
@PART[LiquidEngineLV-T91]:NEEDS[ReStock]:FOR[WaterfallRestock]
{
	!MODULE[ModuleWaterfallFX] {}
  !EFFECTS {}
	!MODULE[EngineLightEffect] {}

	EFFECTS
  {
    engage
    {
      AUDIO
      {
        channel = Ship
        clip = sound_vent_medium
        volume = 1.0
        pitch = 2.0
        loop = false
      }
    }
    flameout
    {
      AUDIO
      {
        channel = Ship
        clip = sound_explosion_low
        volume = 1.0
        pitch = 2.0
        loop = false
      }
    }
    fx-cheetah-running
    {
      AUDIO
      {
        channel = Ship
        clip = sound_rocket_hard
        volume = 0.0 0.0
        volume = 0.01 0.2
        volume = 1.0 0.8
        pitch = 0.0 0.1
        pitch = 0.01 0.2
        pitch = 1.0 0.7
        loop = true
			}
    }
  }

	MODULE
	{
		name = ModuleWaterfallFX
		// This is a custom name
		moduleID = LiquidEngineLV-T91FX
		// This links the effects to a given ModuleEngines
		engineID = LiquidEngineLV-T91

		// List out all controllers we want available
    // This controller scales with atmosphere depth
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    // This controller scales with effective throttle
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
    }
    // this controller generates a random value in the range specified
    CONTROLLER
    {
      name = random
      linkedTo = random
      range = -1, 1
		}

    // -----------------------------------------------------
    // Past here should be generated with the ingame editor!
    // -----------------------------------------------------
    TEMPLATE
    {
      // This is the name of the template to use
      templateName = waterfall-kerolox-upper-3
      // This field allows you to override the parentTransform name in the EFFECTS contained in the template
      overrideParentTransform = fxTransformPlume
      position = 0, -0.13, 0
      rotation = 90, 0, 0
      scale = 1.62, 1.62, 1.62
    }

    TEMPLATE
    {
      // This is the name of the template to use
      templateName = waterfall-kerolox-vernier-1
      // This field allows you to override the parentTransform name in the EFFECTS contained in the template
      overrideParentTransform = vernier_fxTransform
      position = 0, 0, -0.005
      rotation = -90, 0, 0
      scale = 2.3, 2.3, 2
    }
	}
}

