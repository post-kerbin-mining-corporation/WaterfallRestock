// Standard jet engine template. Use for most kinds of modern air-breathing engines
// Employed by Juno, Wheesley, Goliath
// 
// Supported controllers:
//  - [atmosphereDepth] Atmosphere Density
//  - [random] Randomness
//  - [mach] Mach
//  - [throttle] Throttle
//  - [engineOn] Engine On State
//  - [reverser] Scalar Module (AnimateGeneric)
// 
// by Kavaeric
EFFECTTEMPLATE
{
	templateName = waterfall-jet-standard-1
	EFFECT
	{
		name = distort
		parentName = smokePoint
		MODEL
		{
			path = Waterfall/FX/fx-cylinder
			positionOffset = 0, 0, 0
			rotationOffset = -90, 0, 0
			scaleOffset = 1, 3, 1
			MATERIAL
			{
				transform = Cylinder
				shader = Waterfall/Distortion (Dynamic) //Waterfall/Additive (Dynamic)
				randomizeSeed = True
				TEXTURE
				{
					textureSlotName = _DistortionTex
					texturePath = Waterfall/FX/fx-noise-1
					textureScale = 1,1
					textureOffset = 0,0
				}
				FLOAT
				{
					floatName = _Fresnel
					value = 0
				}
				FLOAT
				{
					floatName = _Blur
					value = 5
				}
				FLOAT
				{
					floatName = _Swirl
					value = 5
				}
				FLOAT
				{
					floatName = _ExpandLinear
					value = 1
				}
				FLOAT
				{
					floatName = _Highlight
					value = 0
				}
				FLOAT
				{
					floatName = _Strength
					value = 1
				}
				FLOAT
				{
					floatName = _ExpandOffset
					value = 0
				}
				FLOAT
				{
					floatName = _Falloff
					value = 3
				}
				FLOAT
				{
					floatName = _TileX
					value = 5
				}
				FLOAT
				{
					floatName = _TileY
					value = 10
				}
				FLOAT
				{
					floatName = _SpeedX
					value = 80
				}
				FLOAT
				{
					floatName = _SpeedY
					value = 80
				}
				FLOAT
				{
					floatName = _FresnelInvert
					value = 0
				}
				FLOAT
				{
					floatName = _FadeIn
					value = 0.287409723
				}
				FLOAT
				{
					floatName = _FadeOut
					value = 1.0
				}
			}
		}

		// Increases the strength of the distortion as throttle increases
		FLOATMODIFIER
		{
			floatName = _Strength
			controllerName = throttle
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = throttleStrength
			combinationType = REPLACE
			floatCurve
			{
				key = 0 0.1 0 0
				key = 1 0.3 0 0
			}
		}
		// Increases the length of the trail as throttle increases
		SCALEMODIFIER
		{
			controllerName = throttle
			transformName = Cylinder
			useRandomness = True
			randomnessController = random
			randomnessScale = 0.05
			name = throttleScale
			combinationType = MULTIPLY
			xCurve
			{
				key = 0 1 0 0
			}
			yCurve
			{
				key = 0 1 0 0
				key = 1 4 0 0
			}
			zCurve
			{
				key = 0 1 0 0
			}
		}
		// Disables the effect entirely when the engine is off or flamed out
		FLOATMODIFIER
		{
			floatName = _Strength
			controllerName = engineOn
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = engineOn
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 0 0 0
				key = 1 1 0 0
			}
		}
		// Reduces the strength of the effect as the air gets thinner
		FLOATMODIFIER
		{
			floatName = _Strength
			controllerName = atmosphereDepth
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = atmoStrength
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 0 0 0
				key = 1 1 0 0
			}
		}
		// Reduces the strength of the effect as speed increases
		FLOATMODIFIER
		{
			floatName = _Strength
			controllerName = mach
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = machFadeOut
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 1 0 0
				key = 1 0 0 0
			}
		}
		// Flips the effect's direction upon reverser deployment
		SCALEMODIFIER
		{
			controllerName = reverser
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = reverserScale
			combinationType = MULTIPLY
			xCurve
			{
				key = 0 1 0 0
				key = 1 1 0 0
			}
			yCurve
			{
				key = 0 1 0 0
				key = 1 -0.3 0 0
			}
			zCurve
			{
				key = 0 1 0 0
				key = 1 1 0 0
			}
		}
		// Flares the effect cone upon reverser deployment
		FLOATMODIFIER
		{
			floatName = _ExpandLinear
			controllerName = reverser
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = reverserScale
			combinationType = REPLACE
			floatCurve
			{
				key = 0 0.5 0 0
				key = 1 2 0 0
			}
		}
	}
}
